<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>英雄登场 · 设置</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #17151c;
    color: #ece8f2;
    font: 13px/1.5 "Microsoft YaHei", system-ui, sans-serif;
    -webkit-user-select: none;
    user-select: none;
    overflow: hidden;
  }
  .head {
    display: flex; align-items: center; gap: 12px;
    padding: 18px 20px 14px;
    border-bottom: 1px solid #2b2734;
  }
  .head img { width: 46px; height: 46px; border-radius: 50%; }
  .head h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .head p { margin: 2px 0 0; font-size: 12px; color: #9d95ad; }

  .list { padding: 10px 14px; height: calc(100% - 196px); overflow-y: auto; }
  .row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 6px 8px;
    align-items: center;
    padding: 10px 12px;
    margin-bottom: 8px;
    background: #1f1c26;
    border: 1px solid #2c2836;
    border-radius: 10px;
    cursor: pointer;
  }
  .row.active { border-color: #e070a8; background: #251c26; }
  .row .name { font-weight: 600; font-size: 13px; }
  .row .name input {
    width: 100%; background: #2a2533; border: 1px solid #463d55;
    color: #fff; border-radius: 6px; padding: 2px 6px; font: inherit;
  }
  .row .meta { font-size: 11px; color: #8d8598; margin-top: 2px; }
  .row .tools { display: flex; gap: 6px; grid-column: 2 / 4; justify-content: flex-end; }

  button {
    background: #2a2533; color: #d9d2e4; border: 1px solid #3a3346;
    border-radius: 7px; padding: 4px 9px; font: inherit; cursor: pointer;
  }
  button:hover { background: #352e41; }
  button.primary { background: #d9649b; border-color: #d9649b; color: #fff; }
  button.primary:hover { background: #e070a8; }
  button.danger { color: #ffb4c4; border-color: #6d3040; background: #3a1f28; }
  button.danger:hover { background: #4a2531; }

  .hk {
    width: 96px; text-align: center; font-family: Consolas, monospace;
    background: #12101a; border: 1px solid #3a3346; color: #f0b6d2;
    border-radius: 7px; padding: 4px 6px; cursor: pointer; font-size: 12px;
  }
  .hk.capture { border-color: #e070a8; color: #fff; background: #3a1f2e; }

  .foot {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 12px 18px 16px;
    background: #17151c; border-top: 1px solid #2b2734;
    display: flex; align-items: center; gap: 10px;
  }
  .hint { font-size: 11px; color: #8d8598; flex: 1; }
</style>
</head>
<body>
  <div class="head">
    <img src="assets/icon.png" alt="" />
    <div>
      <h1>英雄登场</h1>
      <p>每个素材独立热键 · 点热键框后直接按组合键</p>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="foot">
    <button id="import" class="primary">＋ 导入素材</button>
    <span class="hint" id="hint">点一行切换当前素材；「试播」立刻预览</span>
    <button id="close">完成</button>
  </div>

  <script src="settings.js"></script>
</body>
</html>
